<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Outfit:wght@600;700&amp;display=swap');

      .font-title {
        font-family: 'Outfit', sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .font-sub {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #94A3B8;
      }
      .font-final {
        font-family: 'Outfit', sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #FFFFFF;
      }

      /* 3D Floating Animation */
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes floatCenter {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.02); }
      }

      /* Laser Dash Flow Animation */
      @keyframes laserFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }

      /* Glowing Pulse */
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0px 0px 8px rgba(255, 102, 0, 0.6)); }
        50% { filter: drop-shadow(0px 0px 20px rgba(255, 102, 0, 0.95)); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 9px; opacity: 1; }
      }

      .card-left { animation: floatLeft 4s ease-in-out infinite; }
      .card-right { animation: floatRight 4s ease-in-out infinite; }
      .card-final { animation: floatCenter 3.5s ease-in-out infinite, pulseGlow 3s infinite; }
      .laser-line { stroke-dasharray: 8 8; animation: laserFlow 1.2s linear infinite; }
      .pulse-node { animation: nodePulse 2s ease-in-out infinite; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CC2200"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F7FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas with Subtle Tech Grid -->
  <rect width="800" height="580" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#334155" opacity="0.3"/>
  </pattern>
  <rect width="800" height="580" rx="16" fill="url(#grid)"/>

  <!-- Central Laser Beam Timeline -->
  <line x1="400" y1="40" x2="400" y2="480" stroke="#334155" stroke-width="4"/>
  <line x1="400" y1="40" x2="400" y2="480" stroke="url(#laserGrad)" stroke-width="4" class="laser-line"/>

  <!-- Step 1 (Left): Full-Stack Development -->
  <g class="card-left" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 370 70 L 400 70" stroke="#00F7FF" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="70" r="7" fill="#00F7FF" class="pulse-node"/>
    
    <!-- Card Frame -->
    <rect x="90" y="42" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="90" y="42" width="6" height="56" rx="3" fill="#38bdf8"/>
    <!-- Icon & Text -->
    <text x="112" y="76" font-size="22">🌐</text>
    <text x="146" y="68" class="font-title">Full-Stack Development</text>
    <text x="146" y="85" class="font-sub">MERN • Next.js • Web Apps</text>
  </g>

  <!-- Step 2 (Right): Backend Engineering -->
  <g class="card-right" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 400 140 L 430 140" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="140" r="7" fill="#818cf8" class="pulse-node"/>

    <!-- Card Frame -->
    <rect x="430" y="112" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="704" y="112" width="6" height="56" rx="3" fill="#818cf8"/>
    <!-- Icon & Text -->
    <text x="450" y="146" font-size="22">⚙️</text>
    <text x="484" y="138" class="font-title">Backend Engineering</text>
    <text x="484" y="155" class="font-sub">Node.js • Express • APIs</text>
  </g>

  <!-- Step 3 (Left): Desktop & Systems Engineering -->
  <g class="card-left" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 370 210 L 400 210" stroke="#41CD52" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="210" r="7" fill="#41CD52" class="pulse-node"/>

    <!-- Card Frame -->
    <rect x="90" y="182" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#41CD52" stroke-width="1.5"/>
    <rect x="90" y="182" width="6" height="56" rx="3" fill="#41CD52"/>
    <!-- Icon & Text -->
    <text x="112" y="216" font-size="22">🖥️</text>
    <text x="146" y="208" class="font-title">Desktop &amp; Systems</text>
    <text x="146" y="225" class="font-sub">C++ • PySide6 • Win32 API</text>
  </g>

  <!-- Step 4 (Right): Authentication & Security Systems -->
  <g class="card-right" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 400 280 L 430 280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="280" r="7" fill="#f59e0b" class="pulse-node"/>

    <!-- Card Frame -->
    <rect x="430" y="252" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="704" y="252" width="6" height="56" rx="3" fill="#f59e0b"/>
    <!-- Icon & Text -->
    <text x="450" y="286" font-size="22">🔐</text>
    <text x="484" y="278" class="font-title">Security &amp; Auth Systems</text>
    <text x="484" y="295" class="font-sub">DPAPI • 2FA • OAuth2</text>
  </g>

  <!-- Step 5 (Left): Artificial Intelligence Integrations -->
  <g class="card-left" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 370 350 L 400 350" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="350" r="7" fill="#a855f7" class="pulse-node"/>

    <!-- Card Frame -->
    <rect x="90" y="322" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="90" y="322" width="6" height="56" rx="3" fill="#a855f7"/>
    <!-- Icon & Text -->
    <text x="112" y="356" font-size="22">🤖</text>
    <text x="146" y="348" class="font-title">AI Integrations</text>
    <text x="146" y="365" class="font-sub">LLM APIs • Automation • CDP</text>
  </g>

  <!-- Step 6 (Right): Scalable System Design -->
  <g class="card-right" filter="url(#shadow)">
    <!-- Branch Connector -->
    <path d="M 400 420 L 430 420" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="400" cy="420" r="7" fill="#06b6d4" class="pulse-node"/>

    <!-- Card Frame -->
    <rect x="430" y="392" width="280" height="56" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="704" y="392" width="6" height="56" rx="3" fill="#06b6d4"/>
    <!-- Icon & Text -->
    <text x="450" y="426" font-size="22">🏗️</text>
    <text x="484" y="418" class="font-title">Scalable System Design</text>
    <text x="484" y="435" class="font-sub">Architecture • Caching • DBs</text>
  </g>

  <!-- Step 7 (Center Finale 3D Orange Card): Software Engineering & Entrepreneurship -->
  <g class="card-final" filter="url(#shadow)">
    <circle cx="400" cy="480" r="9" fill="#FF6600" class="pulse-node"/>
    
    <!-- Grand 3D Glowing Card -->
    <rect x="140" y="490" width="520" height="66" rx="16" fill="url(#orangeGrad)" stroke="#FFAA00" stroke-width="2"/>
    <!-- Icon & Text -->
    <text x="175" y="531" font-size="28">🚀</text>
    <text x="218" y="522" class="font-final">Software Engineering &amp; Entrepreneurship</text>
    <text x="218" y="542" font-family="'Fira Code', monospace" font-size="12" fill="#FFE5D9">Building aspirinexar • Next-Gen Digital Products</text>
  </g>
</svg>
