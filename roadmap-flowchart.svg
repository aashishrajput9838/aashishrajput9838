<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&amp;family=Fira+Code:wght@500&amp;display=swap');

      .metro-start {
        font-family: 'Segoe UI', 'Outfit', sans-serif;
        font-size: 26px;
        font-weight: 300;
        fill: #FFFFFF;
      }
      .metro-user {
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #94A3B8;
      }
      .tile-title {
        font-family: 'Segoe UI', sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .tile-sub {
        font-family: 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: rgba(255, 255, 255, 0.85);
      }
      .tile-num {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: rgba(255, 255, 255, 0.5);
      }
      .hero-title {
        font-family: 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .hero-sub {
        font-family: 'Segoe UI', sans-serif;
        font-size: 12px;
        fill: rgba(255, 255, 255, 0.9);
      }

      /* Windows 8.1 Live Tile Hover/Pulse Animation */
      @keyframes tilePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes tileShine {
        0% { opacity: 0.3; transform: translateX(-100%); }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; transform: translateX(100%); }
      }
      @keyframes liveTileSlide {
        0%, 45% { transform: translateY(0px); }
        50%, 95% { transform: translateY(-38px); }
        100% { transform: translateY(0px); }
      }

      .metro-tile {
        transition: transform 0.2s ease;
      }
      .metro-tile:hover {
        transform: scale(1.03);
      }
      .tile-hero-pulse {
        animation: tilePulse 4s ease-in-out infinite;
      }
      .tile-slide-content {
        animation: liveTileSlide 6s ease-in-out infinite;
      }
    </style>

    <!-- Windows 8.1 Metro Background Wallpaper -->
    <linearGradient id="win8Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metro Live Tile Colors -->
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d89ef"/>
      <stop offset="100%" stop-color="#1e5bb8"/>
    </linearGradient>

    <linearGradient id="tilePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e3878"/>
      <stop offset="100%" stop-color="#5c2557"/>
    </linearGradient>

    <linearGradient id="tileTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aba9"/>
      <stop offset="100%" stop-color="#007a78"/>
    </linearGradient>

    <linearGradient id="tileGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a300"/>
      <stop offset="100%" stop-color="#007000"/>
    </linearGradient>

    <linearGradient id="tileMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f00a7"/>
      <stop offset="100%" stop-color="#700076"/>
    </linearGradient>

    <linearGradient id="tileDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5797"/>
      <stop offset="100%" stop-color="#1a3761"/>
    </linearGradient>

    <linearGradient id="tileOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>

    <!-- Tile Drop Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#win8Bg)"/>

  <!-- Windows 8.1 Metro Background Geometric Accents -->
  <circle cx="750" cy="50" r="180" fill="#312e81" opacity="0.25"/>
  <circle cx="50" cy="430" r="140" fill="#1e40af" opacity="0.2"/>

  <!-- Windows 8.1 Header Bar -->
  <g transform="translate(30, 42)">
    <!-- Windows Logo SVG -->
    <path d="M 0 3 L 13 1 L 13 13 L 0 13 Z M 15 0.8 L 30 0 L 30 13 L 15 13 Z M 0 15 L 13 15 L 13 27 L 0 25 Z M 15 15 L 30 15 L 30 28 L 15 27.2 Z" fill="#00a4ef"/>
    <text x="42" y="22" class="metro-start">Start</text>
    <text x="110" y="22" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="300" fill="rgba(255,255,255,0.4)">|</text>
    <text x="126" y="22" class="metro-start" font-size="20">Developer Focus &amp; Roadmap</text>
    <text x="740" y="22" class="metro-user" text-anchor="end">Aashish Rajput ▾</text>
  </g>

  <!-- METRO LIVE TILES GRID -->

  <!-- ROW 1 -->
  <!-- Tile 1: Full-Stack Development (Blue) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(30, 85)">
    <rect width="236" height="110" fill="url(#tileBlue)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">01</text>
    <text x="16" y="42" font-size="24">🌐</text>
    <text x="16" y="74" class="tile-title">Full-Stack Development</text>
    <text x="16" y="94" class="tile-sub">MERN • Next.js • Web Apps</text>
  </g>

  <!-- Tile 2: Backend Engineering (Purple) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(282, 85)">
    <rect width="236" height="110" fill="url(#tilePurple)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">02</text>
    <text x="16" y="42" font-size="24">⚙️</text>
    <text x="16" y="74" class="tile-title">Backend Engineering</text>
    <text x="16" y="94" class="tile-sub">Node.js • Express • APIs</text>
  </g>

  <!-- Tile 3: Desktop & Systems (Teal) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(534, 85)">
    <rect width="236" height="110" fill="url(#tileTeal)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">03</text>
    <text x="16" y="42" font-size="24">🖥️</text>
    <text x="16" y="74" class="tile-title">Desktop &amp; Systems</text>
    <text x="16" y="94" class="tile-sub">C++ • PySide6 • Win32 API</text>
  </g>

  <!-- ROW 2 -->
  <!-- Tile 4: Security & Auth (Green) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(30, 210)">
    <rect width="236" height="110" fill="url(#tileGreen)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">04</text>
    <text x="16" y="42" font-size="24">🔐</text>
    <text x="16" y="74" class="tile-title">Security &amp; Auth Systems</text>
    <text x="16" y="94" class="tile-sub">DPAPI • 2FA • OAuth2</text>
  </g>

  <!-- Tile 5: AI Integrations (Magenta) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(282, 210)">
    <rect width="236" height="110" fill="url(#tileMagenta)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">05</text>
    <text x="16" y="42" font-size="24">🤖</text>
    <text x="16" y="74" class="tile-title">AI Integrations</text>
    <text x="16" y="94" class="tile-sub">LLM APIs • Automation • CDP</text>
  </g>

  <!-- Tile 6: Scalable System Design (Dark Blue) -->
  <g class="metro-tile" filter="url(#tileShadow)" transform="translate(534, 210)">
    <rect width="236" height="110" fill="url(#tileDarkBlue)"/>
    <text x="218" y="22" class="tile-num" text-anchor="end">06</text>
    <text x="16" y="42" font-size="24">🏗️</text>
    <text x="16" y="74" class="tile-title">Scalable System Design</text>
    <text x="16" y="94" class="tile-sub">Architecture • Caching • DBs</text>
  </g>

  <!-- ROW 3: HERO TILE -->
  <!-- Tile 7: Software Engineering & Entrepreneurship (Orange Hero Tile) -->
  <g class="metro-tile tile-hero-pulse" filter="url(#tileShadow)" transform="translate(30, 335)">
    <rect width="740" height="110" fill="url(#tileOrange)"/>
    
    <!-- Metro Accent Line -->
    <rect x="0" y="0" width="740" height="4" fill="#FFAA00"/>

    <text x="718" y="24" class="tile-num" fill="rgba(255,255,255,0.7)">07</text>
    
    <!-- Hero Icon & Details -->
    <text x="24" y="66" font-size="34">🚀</text>
    <text x="76" y="56" class="hero-title">Software Engineering &amp; Entrepreneurship</text>
    <text x="76" y="80" class="hero-sub">Founding &amp; Building aspirinexar • Scalable Full-Stack Platforms &amp; Modern Digital Products</text>
    
    <!-- Live Badge Indicator -->
    <rect x="590" y="68" width="130" height="26" rx="2" fill="rgba(0,0,0,0.25)"/>
    <circle cx="606" cy="81" r="4" fill="#00FF66"/>
    <text x="618" y="85" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">ACTIVE VENTURE</text>
  </g>
</svg>
