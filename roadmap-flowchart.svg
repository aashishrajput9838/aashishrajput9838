<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fira+Code:wght@500&amp;display=swap');

      .num {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8b949e;
      }
      .title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #e6edf3;
      }
      .tech {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #8b949e;
      }
      .hero-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #FF6600;
      }
      .hero-tech {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #f0883e;
      }

      /* Subtle pulse on finale node */
      @keyframes softPulse {
        0%, 100% { r: 5px; opacity: 0.8; }
        50% { r: 7px; opacity: 1; }
      }
      .pulse-dot {
        animation: softPulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Clean Minimal Dark Background Frame -->
  <rect width="800" height="460" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Sleek Vertical Axis -->
  <line x1="55" y1="45" x2="55" y2="400" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ITEM 01 -->
  <g transform="translate(0, 0)">
    <circle cx="55" cy="52" r="4" fill="#38bdf8"/>
    <text x="80" y="56" class="num">01</text>
    <text x="110" y="56" class="title">Full-Stack Development</text>
    <text x="750" y="56" class="tech" text-anchor="end">MERN • Next.js • Web Apps</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 02 -->
  <g transform="translate(0, 58)">
    <circle cx="55" cy="52" r="4" fill="#818cf8"/>
    <text x="80" y="56" class="num">02</text>
    <text x="110" y="56" class="title">Backend Engineering</text>
    <text x="750" y="56" class="tech" text-anchor="end">Node.js • Express • REST APIs</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 03 -->
  <g transform="translate(0, 116)">
    <circle cx="55" cy="52" r="4" fill="#34d399"/>
    <text x="80" y="56" class="num">03</text>
    <text x="110" y="56" class="title">Desktop &amp; Systems Engineering</text>
    <text x="750" y="56" class="tech" text-anchor="end">C++ • PySide6 / Qt • Win32 API</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 04 -->
  <g transform="translate(0, 174)">
    <circle cx="55" cy="52" r="4" fill="#fbbf24"/>
    <text x="80" y="56" class="num">04</text>
    <text x="110" y="56" class="title">Authentication &amp; Security Systems</text>
    <text x="750" y="56" class="tech" text-anchor="end">Windows DPAPI • 2FA • OAuth2</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 05 -->
  <g transform="translate(0, 232)">
    <circle cx="55" cy="52" r="4" fill="#c084fc"/>
    <text x="80" y="56" class="num">05</text>
    <text x="110" y="56" class="title">AI Integrations &amp; Automation</text>
    <text x="750" y="56" class="tech" text-anchor="end">LLM APIs • CDP DevTools • WebSockets</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 06 -->
  <g transform="translate(0, 290)">
    <circle cx="55" cy="52" r="4" fill="#22d3ee"/>
    <text x="80" y="56" class="num">06</text>
    <text x="110" y="56" class="title">Scalable System Architecture</text>
    <text x="750" y="56" class="tech" text-anchor="end">System Design • Caching • Databases</text>
    <line x1="110" y1="75" x2="750" y2="75" stroke="#161b22" stroke-width="1"/>
  </g>

  <!-- ITEM 07: FINALE -->
  <g transform="translate(0, 348)">
    <circle cx="55" cy="52" r="5" fill="#FF6600" class="pulse-dot"/>
    <text x="80" y="56" class="num" fill="#FF6600" font-weight="700">07</text>
    <text x="110" y="56" class="hero-title">Software Engineering &amp; Entrepreneurship</text>
    <text x="750" y="56" class="hero-tech" text-anchor="end">aspirinexar • Digital Products &amp; Platforms</text>
  </g>
</svg>
